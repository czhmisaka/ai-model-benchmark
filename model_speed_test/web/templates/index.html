<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Czhmisaka - AI模型速度测试</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #FF4500;
            --primary-dim: rgba(255,69,0,0.15);
            --black: #0a0a0a;
            --gray-900: #111;
            --gray-800: #1a1a1a;
            --gray-700: #252525;
            --gray-600: #333;
            --gray-500: #444;
            --gray-400: #666;
            --gray-300: #888;
            --gray-200: #aaa;
            --gray-100: #ccc;
            --white: #fff;
            --accent-red: #FF6B6B;
            --accent-yellow: #FECA57;
            --accent-cyan: #48DBFB;
            --accent-green: #1DD1A1;
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--black);
            color: var(--gray-100);
            min-height: 100vh;
            overflow: hidden;
        }

        /* 全屏布局 */
        .dashboard {
            display: grid;
            grid-template-columns: 400px 1fr;
            grid-template-rows: 60px 1fr 120px;
            height: 100vh;
            gap: 12px;
            padding: 12px;
            background: 
                linear-gradient(90deg, rgba(255,69,0,0.03) 1px, transparent 1px),
                linear-gradient(rgba(255,69,0,0.03) 1px, transparent 1px),
                var(--black);
            background-size: 40px 40px;
        }

        /* 顶部栏 */
        .header {
            grid-column: span 2;
            background: var(--gray-800);
            border: 1px solid var(--gray-700);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        /* 全屏按钮 */
        .fullscreen-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            padding: 0;
            border: none;
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            margin-right: 16px;
            flex-shrink: 0;
        }
        .fullscreen-btn:hover {
            background: var(--gray-700);
        }
        .fullscreen-btn .fullscreen-icon {
            font-size: 20px;
            color: var(--gray-400);
        }
        .fullscreen-btn:hover .fullscreen-icon {
            color: var(--white);
        }
        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--white);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo::before {
            content: '';
            width: 8px;
            height: 24px;
            background: var(--primary);
            border-radius: 2px;
        }
        .logo-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--primary);
            background: var(--primary-dim);
            padding: 4px 10px;
            border-radius: 12px;
        }

        .controls {
            display: flex;
            gap: 12px;
        }
        .btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-primary { background: var(--primary); color: var(--white); }
        .btn-primary:hover { background: #ff5722; transform: translateY(-1px); }
        .btn-secondary { background: var(--gray-700); color: var(--gray-200); border: 1px solid var(--gray-600); }
        .btn-secondary:hover { background: var(--gray-600); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        /* 状态指示 */
        .status-row { display: flex; gap: 20px; }
        .status-item { display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gray-500); }
        .status-dot.connected { background: var(--primary); box-shadow: 0 0 8px var(--primary); }
        .status-dot.running { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
        .status-label { color: var(--gray-400); }
        .status-value { color: var(--white); }

        /* 左侧面板 */
        .panel-left {
            background: var(--gray-800);
            border: 1px solid var(--gray-700);
            border-radius: 12px;
            padding: 8px;
            display: flex;
            flex-direction: row;
            gap: 8px;
            overflow: hidden;
            height: 100%;
            box-sizing: border-box;
        }
        .panel-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--white);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .panel-title::before { content: '■'; color: var(--primary); margin-right: 8px; }
        .item-list { flex: 1 1 auto; overflow-y: auto; margin: 0 -4px; padding: 0 4px; min-height: 0; height: 0; }
        .list-section { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
        .list-header { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; color: var(--gray-400); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid var(--gray-700); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        
        .item { display: flex; align-items: center; padding: 8px 10px; background: var(--gray-700); border-radius: 6px; margin-bottom: 4px; cursor: pointer; transition: all 0.2s; border: 1px solid transparent; }
        .item:hover { background: var(--gray-600); }
        .item.selected { border-color: var(--primary); background: var(--primary-dim); }
        .item-checkbox { width: 14px; height: 14px; border: 2px solid var(--gray-500); border-radius: 3px; margin-right: 8px; display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 9px; flex-shrink: 0; }
        .item.selected .item-checkbox { border-color: var(--primary); background: var(--primary); }
        .item-name { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--white); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .item-delete { width: 18px; height: 18px; border: none; background: transparent; color: var(--gray-500); cursor: pointer; border-radius: 4px; font-size: 12px; flex-shrink: 0; }
        .item-delete:hover { background: var(--accent-red); color: white; }

        .add-btn { width: 100%; padding: 6px; background: transparent; border: 2px dashed var(--gray-600); border-radius: 6px; color: var(--gray-400); font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; cursor: pointer; transition: all 0.2s; }
        .add-btn:hover { border-color: var(--primary); color: var(--primary); }

        /* 中间任务卡片区域 */
        .panel-main {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
        }
        .tasks-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
        }
        .tasks-title { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--gray-400); text-transform: uppercase; letter-spacing: 1px; }
        .tasks-count { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--primary); }
        
        .task-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 12px;
            overflow-y: auto;
            padding: 4px;
        }
        
        /* 任务卡片 */
        .task-card {
            background: var(--gray-800);
            border: 1px solid var(--gray-700);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            min-height: 320px;
            max-height: 400px;
            transition: all 0.2s;
        }
        .task-card:hover { border-color: var(--gray-500); }
        .task-card.active { border-color: var(--primary); box-shadow: 0 0 12px var(--primary-dim); }
        
        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        .task-info { flex: 1; }
        .task-model { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--primary); margin-bottom: 4px; }
        .task-case { font-family: 'Space Grotesk', sans-serif; font-size: 0.85rem; color: var(--white); }
        .task-status { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; padding: 3px 8px; border-radius: 10px; }
        .task-status.running { background: var(--accent-green); color: var(--black); }
        .task-status.done { background: var(--gray-600); color: var(--gray-300); }
        .task-status.error { background: var(--accent-red); color: var(--white); }

        /* 进度条 */
        .task-progress { margin-bottom: 12px; }
        .task-progress-bar { height: 6px; background: var(--gray-700); border-radius: 3px; overflow: hidden; }
        .task-progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #ff6b2c); border-radius: 3px; transition: width 0.3s; }
        .task-progress-text { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--gray-400); margin-top: 4px; display: flex; justify-content: space-between; }

        /* 卡片内容区 */
        .task-content { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            min-height: 0; 
        }
        .task-io { 
            display: block;
            width: 100%;
            overflow: visible;
        }
        .task-io-header { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; color: var(--gray-500); text-transform: uppercase; margin-bottom: 4px; }
        .task-io-content { 
            flex: 1; 
            background: var(--gray-900); 
            border-radius: 6px; 
            padding: 8px; 
            overflow-y: auto; 
            font-size: 0.7rem; 
            line-height: 1.5; 
            color: var(--gray-300);
            white-space: pre-wrap;
            word-break: break-word;
        }
        .task-io-content.streaming { border: 1px dashed var(--primary); background: rgba(255,69,0,0.05); }
        .cursor { display: inline-block; width: 2px; height: 1em; background: var(--primary); animation: blink 1s infinite; vertical-align: text-bottom; }

        /* 轮次矩阵 - 使用 Grid 布局实现动态行列 */
        .round-matrix { 
            display: grid;
            width: 100%;
            gap: 4px;
            /* 默认7列，每列自适应 */
            grid-template-columns: repeat(7, 1fr);
            overflow: visible;
        }
        
        /* 圆环按钮 - 进度环样式 */
        .round-btn { 
            aspect-ratio: 1;
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            background: var(--gray-700);
            color: var(--gray-400);
            border: 2px solid var(--gray-600);
            /* 默认字体大小，会被JS覆盖 */
            font-size: 0.6rem;
        }
        
        /* 圆环进度条 */
        .round-btn::before {
            content: '';
            position: absolute;
            inset: 2px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--primary);
        }
        
        /* 待测试状态 - 灰色 */
        .round-btn.pending { 
            background: var(--gray-800); 
            color: var(--gray-500);
            border-color: var(--gray-700);
        }
        .round-btn.pending::before {
            display: none;
        }
        .round-btn.pending:hover { 
            border-color: var(--primary);
            color: var(--primary);
        }
        
        /* 进行中状态 - 主题橙色 */
        .round-btn.running { 
            background: var(--primary-dim); 
            color: var(--primary);
            border-color: var(--primary);
            animation: pulse-ring 1.5s ease-in-out infinite;
        }
        .round-btn.running::before {
            border-top-color: var(--white);
            animation: spin 1s linear infinite;
        }
        
        @keyframes pulse-ring {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 69, 0, 0.4); }
            50% { box-shadow: 0 0 0 6px rgba(255, 69, 0, 0); }
        }
        
        /* 完成状态 - 主题橙色 */
        .round-btn.done { 
            background: var(--primary); 
            color: var(--white);
            border-color: var(--primary);
        }
        .round-btn.done::before {
            display: none;
        }
        .round-btn.done:hover {
            transform: scale(1.15);
            box-shadow: 0 0 12px var(--primary);
        }
        
        /* 错误状态 - 红色 */
        .round-btn.error { 
            background: var(--accent-red); 
            color: var(--white);
            border-color: var(--accent-red);
        }
        .round-btn.error::before {
            display: none;
        }
        
        /* 激活/选中状态 */
        .round-btn.active {
            border-color: var(--white);
            box-shadow: 0 0 12px var(--primary);
            transform: scale(1.15);
        }
        
        @keyframes spin { 
            to { transform: rotate(360deg); } 
        }
        
        /* Loading 动画 */
        .loading-spinner { 
            width: 14px; 
            height: 14px; 
            border: 2px solid var(--gray-600); 
            border-top-color: var(--primary); 
            border-radius: 50%; 
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* 任务标签 */
        .task-label { flex: 1; font-size: 0.7rem; color: var(--gray-300); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .task-status-icon { font-size: 0.7rem; }

        /* 轮次 Popover */
        .round-popover {
            position: absolute;
            z-index: 100;
            background: var(--gray-900);
            border: 1px solid var(--primary);
            border-radius: 8px;
            padding: 12px;
            max-width: 400px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 0.7rem;
            line-height: 1.5;
            color: var(--gray-300);
            white-space: pre-wrap;
            word-break: break-word;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: none;
            pointer-events: none;
        }
        .round-popover.visible {
            display: block;
        }
        .round-popover.streaming {
            border: 1px dashed var(--primary);
            background: rgba(255,69,0,0.05);
        }
        /* Popover 标题 */
        .round-popover-header {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            color: var(--primary);
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--gray-700);
        }
        /* Popover 内容 */
        .round-popover-content {
            white-space: pre-wrap;
            word-break: break-word;
        }
        /* 加载动画 */
        .round-popover-loading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--gray-400);
        }
        @keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0} }

        /* 卡片指标 */
        .task-metrics { display: flex; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--gray-700); }
        .task-metric { flex: 1; text-align: center; }
        .task-metric-value { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; font-weight: 600; color: var(--white); }
        .task-metric-label { font-family: 'JetBrains Mono', monospace; font-size: 0.55rem; color: var(--gray-500); }
        
        /* 最终结果 */
        .task-result { 
            display: none; 
            margin-top: 8px; 
            padding: 10px; 
            background: var(--primary-dim); 
            border-radius: 6px; 
            border: 1px solid var(--primary);
        }
        .task-result.visible { display: block; }
        .task-result-title { 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 0.65rem; 
            color: var(--primary); 
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .task-result-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 8px; 
        }
        .task-result-item { text-align: center; }
        .task-result-value { 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 0.85rem; 
            font-weight: 600; 
            color: var(--white); 
        }
        .task-result-label { 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 0.5rem; 
            color: var(--gray-400); 
            margin-top: 2px;
        }

        /* 空状态 */
        .empty-tasks { height: 100%; display: flex; align-items: center; justify-content: center; color: var(--gray-500); font-size: 0.9rem; }

        /* 底部日志 */
        .log-area {
            grid-column: span 2;
            background: var(--gray-800);
            border: 1px solid var(--gray-700);
            border-radius: 12px;
            padding: 12px 16px;
            overflow-x: auto;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
        }
        .log-item { display: flex; align-items: center; gap: 8px; color: var(--gray-400); white-space: nowrap; flex-shrink: 0; }
        .log-time { color: var(--gray-600); }
        .log-tag { padding: 2px 8px; border-radius: 4px; font-size: 0.65rem; background: var(--gray-700); }
        .log-tag.model { background: var(--primary-dim); color: var(--primary); }
        .log-tag.case { background: rgba(72,219,251,0.15); color: var(--accent-cyan); }
        .log-tag.round { background: rgba(29,209,161,0.15); color: var(--accent-green); }
        .log-tag.error { background: rgba(255,107,107,0.15); color: var(--accent-red); }

        /* 滚动条 */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--gray-600); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gray-500); }

        /* Toast */
        .toast { position: fixed; top: 80px; left: 20px; background: var(--gray-800); border: 1px solid var(--gray-600); color: var(--white); padding: 12px 20px; border-radius: 8px; font-size: 0.85rem; z-index: 1000; transform: translateX(-120%); transition: transform 0.3s; }
        .toast.show { transform: translateX(0); }
        .toast.success { border-color: var(--accent-green); }
        .toast.error { border-color: var(--accent-red); }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal-overlay.show { display: flex; }
        .modal { background: var(--gray-800); border: 1px solid var(--gray-700); border-radius: 12px; padding: 24px; width: 400px; max-width: 90vw; }
        .modal-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.1rem; font-weight: 600; color: var(--white); margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-label { font-size: 0.75rem; color: var(--gray-400); margin-bottom: 6px; display: block; }
        .form-input { width: 100%; padding: 10px 14px; background: var(--gray-700); border: 1px solid var(--gray-600); border-radius: 8px; color: var(--white); font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; }
        .form-input:focus { outline: none; border-color: var(--primary); }
        textarea.form-input { min-height: 80px; resize: vertical; }
        .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

        /* 历史记录模态框 */
        .history-modal { width: 800px; max-height: 80vh; }
        .history-modal .modal-body { max-height: 60vh; overflow-y: auto; }
        .history-list { display: flex; flex-direction: column; gap: 8px; }
        .history-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px; 
            background: var(--gray-700); 
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        .history-item:hover { background: var(--gray-600); border-color: var(--gray-500); }
        .history-item.selected { border-color: var(--primary); background: var(--primary-dim); }
        .history-info { flex: 1; }
        .history-name { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--white); }
        .history-meta { font-size: 0.7rem; color: var(--gray-400); margin-top: 4px; }
        .history-stats { display: flex; gap: 16px; }
        .history-stat { text-align: center; }
        .history-stat-value { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; color: var(--white); }
        .history-stat-label { font-size: 0.6rem; color: var(--gray-500); }
        .history-actions { display: flex; gap: 8px; }
        
        /* 响应式 */
        @media (max-width: 1024px) {
            .dashboard { grid-template-columns: 240px 1fr; }
            .task-cards { grid-template-columns: 1fr; }
            .history-modal { width: 90vw; }
        }
        @media (max-width: 768px) {
            .dashboard { grid-template-columns: 1fr; grid-template-rows: 60px auto 1fr 100px; }
            .panel-left { max-height: 200px; }
            .header { flex-wrap: wrap; gap: 12px; }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- 顶部栏 -->
        <header class="header">
            <div class="logo">
                <button class="fullscreen-btn" onclick="toggleFullscreen()" title="全屏显示">
                    <span class="fullscreen-icon" id="fullscreenIcon">⤢</span>
                </button>
                Czhmisaka
                <span class="logo-tag">MODEL TEST</span>
            </div>
            <div class="status-row">
                <div class="status-item">
                    <span class="status-dot" id="sseDot"></span>
                    <span class="status-label">SSE</span>
                    <span class="status-value" id="sseStatus">--</span>
                </div>
                <div class="status-item">
                    <span class="status-dot" id="testDot"></span>
                    <span class="status-label">TEST</span>
                    <span class="status-value" id="testStatus">IDLE</span>

            </div>
            <div class="controls">
                <button class="btn btn-primary" id="startBtn" onclick="startTest()">▶ START</button>
                <button class="btn btn-secondary" id="stopBtn" onclick="stopTest()" disabled>■ STOP</button>
                <button class="btn btn-secondary" id="clearBtn" onclick="clearTest()">✕ CLEAR</button>
                <button class="btn btn-secondary" id="historyBtn" onclick="showHistoryModal()">☰ HISTORY</button>
            </div>
        </header>

        <!-- 左侧：配置 -->
        <div class="panel-left">
            <!-- Models 列 -->
            <div class="list-section">
                <div class="list-header">
                    <span>Models</span>
                    <button class="add-btn" onclick="showModal('model')" style="width:auto;padding:2px 6px;flex-shrink:0">+</button>
                </div>
                <div class="item-list" id="modelList"></div>
                <button class="add-btn" onclick="selectAllModels()" style="margin-top:4px;font-size:0.6rem;padding:4px;flex-shrink:0">Select All</button>
            </div>
            
            <!-- Test Cases 列 -->
            <div class="list-section">
                <div class="list-header">
                    <span>Test Cases</span>
                    <button class="add-btn" onclick="showModal('case')" style="width:auto;padding:2px 6px;flex-shrink:0">+</button>
                </div>
                <div class="item-list" id="caseList"></div>
                <button class="add-btn" onclick="selectAllCases()" style="margin-top:4px;font-size:0.6rem;padding:4px;flex-shrink:0">Select All</button>
            </div>
        </div>

        <!-- 中间：任务卡片 -->
        <div class="panel-main">
            <div class="tasks-header">
                <span class="tasks-title">Running Tasks</span>
                <span class="tasks-count" id="tasksCount">0 tasks</span>
            </div>
            <div class="task-cards" id="taskCards">
                <div class="empty-tasks">Select models and test cases, then click START</div>
            </div>
        </div>

        <!-- 底部：日志 -->
        <div class="log-area" id="logArea">
            <div class="log-item">
                <span class="log-time">--:--:--</span>
                <span class="log-tag">SYSTEM</span>
                <span>Ready</span>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-title" id="modalTitle">Add Model</div>
            <div id="modelForm">
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-input" id="mName" placeholder="My Model">
                </div>
                <div class="form-group">
                    <label class="form-label">Endpoint</label>
                    <input type="text" class="form-input" id="mEndpoint" placeholder="https://api.example.com/v1/chat/completions">
                </div>
                <div class="form-group">
                    <label class="form-label">API Key</label>
                    <input type="text" class="form-input" id="mKey" placeholder="sk-...">
                </div>
                <div class="form-group">
                    <label class="form-label">Model</label>
                    <input type="text" class="form-input" id="mModelName" placeholder="gpt-4o-mini">

            </div>

                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-input" id="cName" placeholder="Test Case">
                </div>
                <div class="form-group">
                    <label class="form-label">Prompt</label>
                    <textarea class="form-input" id="cPrompt" placeholder="Enter prompt..."></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Max Tokens</label>
                    <input type="number" class="form-input" id="cMaxTokens" value="500">
                </div>
            </div>

                <button class="btn btn-secondary" onclick="hideModal()">Cancel</button>
                <button class="btn btn-primary" id="modalSubmit" onclick="submitModal()">Add</button>
            </div>
